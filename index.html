<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One World 2026 – Film Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d14; --card: #15151f; --border: #252535;
      --accent: #e63946; --accent2: #457b9d; --text: #e0e0e0; --muted: #666;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header { background: linear-gradient(135deg,#1a0a0a,#0d0d14); border-bottom:1px solid var(--border); padding:.9rem 1.2rem; position:sticky; top:0; z-index:200; }
    .header-top { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:.7rem; }
    .logo-main { font-size:1.3rem; font-weight:800; color:var(--accent); white-space:nowrap; }
    .logo-sub { font-size:.72rem; color:var(--muted); }
    .filters { display:flex; flex-direction:column; gap:.5rem; }
    .filter-row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .filters input, .filters select {
      background:var(--card); border:1px solid var(--border); color:var(--text);
      padding:.38rem .7rem; border-radius:7px; font-size:.83rem; outline:none;
    }
    .filters input { width:100%; }
    .filters input:focus, .filters select:focus { border-color:var(--accent2); }
    .count { color:var(--muted); font-size:.8rem; white-space:nowrap; margin-left:auto; }
    .view-toggle { display:flex; gap:.3rem; }
    .view-btn { padding:.35rem .8rem; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--muted); cursor:pointer; font-size:.8rem; font-weight:600; }
    .view-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn-random { padding:.35rem .9rem; border-radius:6px; border:1px solid #f4a261; background:transparent; color:#f4a261; cursor:pointer; font-size:.8rem; font-weight:700; transition:background .15s,color .15s; }
    .btn-random:hover { background:#f4a261; color:#000; }

    /* ── List view ── */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:1rem; padding:1.2rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:11px; overflow:hidden; cursor:pointer; transition:transform .18s,border-color .18s,box-shadow .18s; }
    .card:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 8px 24px rgba(230,57,70,.15); }
    .card-img { width:100%; aspect-ratio:16/9; object-fit:cover; background:#1a1a2e; display:block; }
    .card-ph { width:100%; aspect-ratio:16/9; background:linear-gradient(135deg,#1a1a2e,#15151f); display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
    .card-body { padding:.85rem; display:flex; flex-direction:column; gap:.4rem; }
    .card-type { font-size:.68rem; color:var(--accent2); text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
    .card-title { font-size:.95rem; font-weight:700; color:#fff; line-height:1.3; }
    .card-desc { font-size:.78rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-screenings { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.3rem; }
    .screening-chip { font-size:.68rem; padding:.15rem .45rem; border-radius:4px; color:#fff; font-weight:600; white-space:nowrap; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:.4rem; }
    .visit-link { font-size:.72rem; color:var(--accent); text-decoration:none; font-weight:600; }
    .visit-link:hover { text-decoration:underline; }

    /* ── Calendar view ── */
    .calendar-wrap { padding:1rem 1.2rem; overflow-x:auto; }
    .cal-table { border-collapse:collapse; min-width:900px; width:100%; }
    .cal-table th { background:#1a1a2e; padding:.5rem .7rem; font-size:.75rem; font-weight:700; text-align:left; color:#aaa; border:1px solid var(--border); white-space:nowrap; }
    .cal-table td { border:1px solid var(--border); padding:0; vertical-align:top; width:calc(100%/9); min-width:110px; background:var(--bg); }
    .cal-cell { padding:.4rem; min-height:60px; }
    .cal-event { margin-bottom:.3rem; border-radius:5px; padding:.3rem .45rem; font-size:.72rem; cursor:pointer; transition:opacity .15s; border:none; text-align:left; width:100%; }
    .cal-event:hover { opacity:.8; }
    .cal-event-title { font-weight:700; color:#fff; line-height:1.2; margin-bottom:.15rem; }
    .cal-event-time { color:rgba(255,255,255,.7); font-size:.65rem; }
    .cal-venue-label { font-size:.65rem; padding:.2rem .4rem; border-radius:3px; display:inline-block; margin-bottom:.3rem; font-weight:700; }

    /* ── Modal ── */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:1000; align-items:center; justify-content:center; padding:1rem; }
    .modal-backdrop.open { display:flex; }
    .modal-wrap { position:relative; max-width:700px; width:100%; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:14px; max-height:90vh; overflow-y:auto; }
    .modal-img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px 14px 0 0; }
    .modal-body { padding:1.3rem; }
    .modal-type { font-size:.72rem; color:var(--accent2); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:.4rem; }
    .modal-title { font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:.8rem; line-height:1.2; }
    .modal-desc { color:#bbb; line-height:1.7; font-size:.92rem; margin-bottom:1.2rem; }
    .modal-screenings-title { font-size:.8rem; font-weight:700; color:#aaa; text-transform:uppercase; letter-spacing:.05em; margin-bottom:.5rem; }
    .modal-screenings { display:flex; flex-direction:column; gap:.4rem; margin-bottom:1.2rem; }
    .modal-screening { display:flex; align-items:center; gap:.6rem; padding:.45rem .7rem; border-radius:7px; text-decoration:none; }
    .modal-screening:hover { opacity:.85; }
    .modal-screening-venue { font-weight:700; color:#fff; font-size:.85rem; flex:1; }
    .modal-screening-when { color:rgba(255,255,255,.7); font-size:.78rem; white-space:nowrap; }
    .modal-screening-buy { font-size:.72rem; background:rgba(255,255,255,.15); color:#fff; padding:.15rem .4rem; border-radius:4px; white-space:nowrap; }
    .modal-actions { display:flex; gap:.7rem; }
    .btn { padding:.55rem 1.1rem; border-radius:7px; font-size:.88rem; font-weight:700; cursor:pointer; text-decoration:none; border:none; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-secondary { background:#1d2d44; color:var(--text); }
    .close-btn { position:absolute; top:.7rem; right:.7rem; background:rgba(0,0,0,.6); border:none; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; }
    .empty { grid-column:1/-1; text-align:center; padding:4rem; color:var(--muted); font-size:1rem; }
    @media(max-width:600px) { .grid { grid-template-columns:1fr; } }

    .venue-legend { display:flex; flex-wrap:wrap; gap:.4rem; padding:.5rem 1.2rem; }
    .legend-item { display:flex; align-items:center; gap:.3rem; font-size:.72rem; color:#aaa; }
    .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="logo-main">🎬 One World 2026</div>
      <div class="logo-sub">Human Rights Film Festival · 11–19 March · Prague</div>
    </div>
  </div>
  <div class="filters">
    <input type="text" id="search" placeholder="Search films…" oninput="render()">
    <div class="filter-row">
      <select id="typeFilter" onchange="render()">
        <option value="">All types</option>
        <option value="Full-length documentary">Documentary</option>
        <option value="Feature film">Feature film</option>
        <option value="Short documentary">Short</option>
        <option value="Virtual reality">VR</option>
      </select>
      <select id="venueFilter" onchange="render()">
        <option value="">All venues</option>
      </select>
      <button class="btn-random" onclick="openRandom()">🎲 Random</button>
      <span class="count" id="count"></span>
      <div class="view-toggle">
        <button class="view-btn active" id="btnList" onclick="setView('list')">☰ List</button>
        <button class="view-btn" id="btnCal" onclick="setView('calendar')">📅 Calendar</button>
      </div>
    </div>
  </div>
</header>

<div id="listView">
  <div class="grid" id="grid"></div>
</div>

<div id="calView" style="display:none">
  <div class="venue-legend" id="venueLegend"></div>
  <div class="calendar-wrap">
    <table class="cal-table" id="calTable"></table>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-wrap">
    <div class="modal" id="modal">
      <img class="modal-img" id="modalImg" src="" alt="" style="display:none">
      <div class="modal-body">
        <div class="modal-type" id="modalType"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-screenings-title" id="modalScreenTitle" style="display:none">Screenings</div>
        <div class="modal-screenings" id="modalScreenings"></div>
        <div class="modal-actions">
          <a class="btn btn-primary" id="modalLink" href="#" target="_blank">oneworld.cz →</a>
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
</div>

<script>
const FILMS = [{"type": "Full-length documentary", "title": "2000 Meters to Andriivka", "link": "https://www.oneworld.cz/films/57974-2000-meters-to-andriivka", "desc": "The small Ukrainian village of Andriivka, destroyed by Russian aggression, represents a crucial strategic point. A Ukrainian military unit is tasked with a single mission: to reclaim an occupied targe", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20040"}, {"type": "Full-length documentary", "title": "32 Meters", "link": "https://www.oneworld.cz/films/59399-32-meters", "desc": "A humorous look into the heart of a Turkish village, where a group of women decide to challenge traditional social roles in an imaginative way. They do so with due wit and stubbornness.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20041"}, {"type": "Virtual reality", "title": "8 Billion Selves", "link": "https://www.oneworld.cz/films/59680-8-billion-selves", "desc": "Is it possible to attain uniqueness among eight billion others? 8 Billion Selves is a flowing, dreamlike journey through a world where people “are born, work, wage war, love, dance, create art, and di", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20042"}, {"type": "Full-length documentary", "title": "80 Angry Journalists", "link": "https://www.oneworld.cz/films/59666-80-angry-journalists", "desc": "The Hungarian government succeeded in taking control of one of the country’s most prominent independent media outlets, Index.hu. The journalists fight back with every tool at their disposal, but the s", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20195"}, {"type": "Full-length documentary", "title": "9-Month Contract", "link": "https://www.oneworld.cz/films/57975-9-month-contract", "desc": "Surrogacy in Georgia exists in a legal gray zone, yet for young single mother Zhana, it seems like the only way to provide herself and her daughter Elena with a dignified life, education, and a future", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20044"}, {"type": "Full-length documentary", "title": "A Fox Under a Pink Moon", "link": "https://www.oneworld.cz/films/59559-a-fox-under-a-pink-moon", "desc": "Millions of Afghan men and women live in Iran without permanent legal status or protection. Sixteen-year-old Soraya suffers domestic abuse as well as the inability to freely decide her own future.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20078"}, {"type": "Full-length documentary", "title": "A Free Daughter of Free Kyrgyzstan", "link": "https://www.oneworld.cz/films/58528-a-free-daughter-of-free-kyrgyzstan", "desc": "Zere is a rebel, stirring the stagnant waters of Kyrgyz patriarchy. Through her music and public performances, she exposes the alarming state of girls’ and women’s rights in a country where they are e", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20045"}, {"type": "Full-length documentary", "title": "Action Item", "link": "https://www.oneworld.cz/films/58850-action-item", "desc": "Fatigue as the norm, performance as an obligation. Burnout is becoming a hidden yet widespread experience for people living under constant pressure and the expectation of uninterrupted online and prof", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20046"}, {"type": "Short documentary", "title": "Alex – Everyone is Special", "link": "https://www.oneworld.cz/films/59644-alex-everyone-is-special", "desc": "Alex is a happy, twelve-year old boy with autism who loves school and his friends. This year, he has set himself a challenging new goal: to learn how to ride a bike.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20198"}, {"type": "Feature film", "title": "Allah Is Not Obliged", "link": "https://www.oneworld.cz/films/58285-allah-is-not-obliged", "desc": "Birahim is only ten years old, yet he must embark on a journey across West Africa, an area plagued by armed conflict. His search for relatives leads him through bands of child soldiers where compassio", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20048"}, {"type": "Full-length documentary", "title": "AMOOSED: a moose odyssey", "link": "https://www.oneworld.cz/films/59383-amoosed-a-moose-odyssey", "desc": "Moose have played a vital and, to this day, somewhat mysterious role in our world since time immemorial. Their massive figures reflect considerable strength, a calm beauty, and the forgotten bond betw", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20193"}, {"type": "Virtual reality", "title": "Another Place", "link": "https://www.oneworld.cz/films/58640-another-place", "desc": "A young trans woman awaits asylum in France, wandering the city at night in a state of unease. Will she ever return home to her cats?", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20050"}, {"type": "Special", "title": "Awarded Film: International Competition", "link": "https://www.oneworld.cz/films/59681-awarded-film-international-competition", "desc": "", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID="}, {"type": "Full-length documentary", "title": "Better Go Mad in the Wild", "link": "https://www.oneworld.cz/films/58487-better-go-mad-in-the-wild", "desc": "Is it possible to escape the modern world and survive solely in the company of one’s brother, a few pets, and one’s own imagination? An intimate look at the magical coexistence of modern-day hermits i", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20051"}, {"type": "Full-length documentary", "title": "Carmela and the Walkers", "link": "https://www.oneworld.cz/films/58696-carmela-and-the-walkers", "desc": "Carmela helps thousands of Venezuelan refugees, bravely doing so often at great personal cost. This black-and-white documentary shows how exhausting it can be to do good while trying to keep your own ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20052"}, {"type": "Full-length documentary", "title": "Coexistence, My Ass!", "link": "https://www.oneworld.cz/films/57984-coexistence-my-ass", "desc": "Comedienne Noam Shuster-Eliassi takes up the fight against prejudice towards the Palestinian people. Her weapons are a microphone, courage, and humour. But can an Israeli celebrity change her own soci", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20053"}, {"type": "Full-length documentary", "title": "Cuba&Alaska", "link": "https://www.oneworld.cz/films/58526-cuba-alaska", "desc": "Kuba and Alaska enlist as paramedics on the front lines near Kharkiv, Ukraine, where the brutality of war tests them daily. Humor and friendship keep their faith in victory alive amid the chaos.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20056"}, {"type": "Full-length documentary", "title": "Cutting Through Rocks", "link": "https://www.oneworld.cz/films/58068-cutting-through-rocks", "desc": "Sara lives in an Iranian village, where she becomes the first woman elected to the local council. Charismatic and determined, she carves a path through a conservative society on her motorcycle, fighti", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20187"}, {"type": "Full-length documentary", "title": "Dangerous Games: Roblox and the Metaverse Exposed", "link": "https://www.oneworld.cz/films/59677-dangerous-games-roblox-and-the-metaverse-exposed", "desc": "The gaming platform Roblox is a digital world primarily designed for children. But beneath its playful surface lie extremism, racism, and sexual predators. Three teenage girls take it upon themselves ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20058"}, {"type": "Feature film", "title": "Deaf", "link": "https://www.oneworld.cz/films/58228-deaf", "desc": "Ángela is expecting a baby, but her genuine excitement is tinged with worry. How will she navigate motherhood in a world that cannot hear her? This exceptionally sensitive drama explores partnership a", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20190"}, {"type": "Full-length documentary", "title": "Dear Tomorrow", "link": "https://www.oneworld.cz/films/58069-dear-tomorrow", "desc": "Japan has recently become a hot tourist destination—a place everyone wants to be. But behind the neon lights of its big cities lies a major loneliness epidemic.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20189"}, {"type": "Full-length documentary", "title": "Death of Death", "link": "https://www.oneworld.cz/films/59480-death-of-death", "desc": "A futuristic journey in pursuit of immortality that explores the thrilling and unsettling boundaries of human existence.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20062"}, {"type": "Full-length documentary", "title": "Desert Passages", "link": "https://www.oneworld.cz/films/59603-desert-passages", "desc": "The Colorado River is drying up. Once a lifeline linking the southwestern United States and Mexico, it is now a witness to shifting ecosystems, changing ways of life, and the widening inequalities of ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20063"}, {"type": "Full-length documentary", "title": "Devi", "link": "https://www.oneworld.cz/films/59343-devi", "desc": "Once at the forefront of the fight for equality and justice, her voice has now become inconvenient for the regime. Nepali politician Devi Khadku is one of thousands of women who were subjected to viol", "img": "https://muj.jedensvet.cz/filmimages/ima // Venue colors
const VENUES = [
  "Lucerna Cinema – Large Hall",
  "Světozor Cinema – Large Hall","Světozor Cinema – Small Hall",
  "Prague Municipal Library – Large Hall","Prague Municipal Library – Small Hall",
  "Edison Filmhub","Bio Oko","Ponrepo Cinema","Kino Pilotů","Evald",
  "Kino 35 - French Institute in Prague","Gallery 35 - French Institute in Prague",
  "ARCHA+ (Large Hall)","ARCHA+ (Small Hall)",
  "The Lounge at Café Lucerna (evening podcast stage)"
];
const VENUE_COLORS = [
  "#e63946","#2a9d8f","#1a8fe3","#e9c46a","#f4a261",
  "#8338ec","#06d6a0","#ef476f","#ffd166","#118ab2",
  "#c77dff","#ff9f1c","#48cae4","#b5179e","#95d5b2"
];
const venueColor = v => {
  const i = VENUES.indexOf(v);
  return i >= 0 ? VENUE_COLORS[i] : "#666";
};

// Preprocess screenings: map film title → screenings
const DAYS = ["2026-03-11","2026-03-12","2026-03-13","2026-03-14","2026-03-15","2026-03-16","2026-03-17","2026-03-18","2026-03-19"];
const DAY_LABELS = ["Wed 11/3","Thu 12/3","Fri 13/3","Sat 14/3","Sun 15/3","Mon 16/3","Tue 17/3","Wed 18/3","Thu 19/3"];

// Build film→screenings map
const filmScreenings = {};
SCREENINGS_RAW.forEach(s => {
  if (!s.films) return;
  s.films.forEach(f => {
    const title = f.title;
    if (!filmScreenings[title]) filmScreenings[title] = [];
    filmScreenings[title].push({
      venue: s.venue, address: s.address,
      date: s.date_iso, time: s.time,
      buy: s.buy
    });
  });
});

// Attach screenings to films
FILMS.forEach(film => {
  film.screenings = filmScreenings[film.title] || [];
});

// Populate venue filter
const venueSelect = document.getElementById("venueFilter");
VENUES.forEach(v => {
  const opt = document.createElement("option");
  opt.value = v; opt.textContent = v;
  venueSelect.appendChild(opt);
});

// Venue legend
const legend = document.getElementById("venueLegend");
VENUES.forEach(v => {
  const el = document.createElement("div");
  el.className = "legend-item";
  el.innerHTML = `<div class="legend-dot" style="background:${venueColor(v)}"></div>${v}`;
  legend.appendChild(el);
});

const typeEmoji = {
  "Full-length documentary":"🎥","Feature film":"🎞️",
  "Short documentary":"📽️","Virtual reality":"🥽","Special":"⭐"
};

let currentView = "list";
function setView(v) {
  currentView = v;
  document.getElementById("listView").style.display = v==="list" ? "" : "none";
  document.getElementById("calView").style.display = v==="calendar" ? "" : "none";
  document.getElementById("btnList").classList.toggle("active", v==="list");
  document.getElementById("btnCal").classList.toggle("active", v==="calendar");
  render();
}

function getFiltered() {
  const q = document.getElementById("search").value.toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const venue = document.getElementById("venueFilter").value;
  return FILMS.filter(f => {
    const mQ = !q || f.title.toLowerCase().includes(q) || (f.desc||"").toLowerCase().includes(q);
    const mT = !type || f.type === type;
    const mV = !venue || (f.screenings||[]).some(s => s.venue === venue);
    return mQ && mT && mV;
  });
}

function render() {
  const filtered = getFiltered();
  document.getElementById("count").textContent = filtered.length + " / " + FILMS.length + " films";
  if (currentView === "list") renderList(filtered);
  else renderCalendar(filtered);
}

function renderList(filtered) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if (!filtered.length) { grid.innerHTML = "<div class=\"empty\">No films match 🎬</div>"; return; }
  filtered.forEach(film => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openModal(film);
    const chips = (film.screenings||[]).slice(0,4).map(s =>
      `<span class="screening-chip" style="background:${venueColor(s.venue)}">${s.time || ""} ${(s.venue||"").split("–")[0].split("(")[0].trim().slice(0,15)}</span>`
    ).join("");
    card.innerHTML = `
      ${film.img ? `<img class="card-img" src="${film.img}" alt="${film.title}" loading="lazy" onerror="this.style.display='none'">` : `<div class="card-ph">${typeEmoji[film.type]||"🎬"}</div>`}
      <div class="card-body">
        <div class="card-type">${film.type||""}</div>
        <div class="card-title">${film.title}</div>
        <div class="card-desc">${film.desc||"No description."}</div>
        ${chips ? `<div class="card-screenings">${chips}</div>` : ""}
        <div class="card-footer">
          <span style="font-size:.72rem;color:var(--muted)">${film.screenings.length} screening${film.screenings.length!==1?"s":""}</span>
          <a class="visit-link" href="${film.link}" target="_blank" onclick="event.stopPropagation()">oneworld.cz →</a>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function renderCalendar(filtered) {
  const table = document.getElementById("calTable");
  table.innerHTML = "";
  const filteredTitles = new Set(filtered.map(f => f.title));

  // Header row
  const hr = document.createElement("tr");
  hr.innerHTML = `<th style="min-width:120px">Venue</th>` + DAY_LABELS.map(d => `<th>${d}</th>`).join("");
  table.appendChild(hr);

  // Build venue→day→screenings map
  const venueMap = {};
  SCREENINGS_RAW.forEach(s => {
    if (!s.venue || !s.date_iso) return;
    const filmsInScreen = (s.films||[]).filter(f => filteredTitles.has(f.title));
    if (!filmsInScreen.length) return;
    if (!venueMap[s.venue]) venueMap[s.venue] = {};
    if (!venueMap[s.venue][s.date_iso]) venueMap[s.venue][s.date_iso] = [];
    venueMap[s.venue][s.date_iso].push({...s, films: filmsInScreen});
  });

  const activeVenues = VENUES.filter(v => venueMap[v]);
  if (!activeVenues.length) {
    table.innerHTML = `<tr><td colspan="10" style="padding:2rem;text-align:center;color:var(--muted)">No screenings match</td></tr>`;
    return;
  }

  activeVenues.forEach(venue => {
    const row = document.createElement("tr");
    const color = venueColor(venue);
    const shortVenue = venue.split("–")[0].split("(")[0].trim();
    row.innerHTML = `<td style="border:1px solid var(--border);padding:.4rem .6rem;font-size:.75rem;font-weight:700;white-space:nowrap;vertical-align:middle">
      <span class="cal-venue-label" style="background:${color}22;color:${color}">${shortVenue}</span></td>`;
    DAYS.forEach(day => {
      const td = document.createElement("td");
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      const dayScreenings = (venueMap[venue]||{})[day] || [];
      dayScreenings.forEach(s => {
        s.films.forEach(filmRef => {
          const film = FILMS.find(f => f.title === filmRef.title);
          if (!film) return;
          const btn = document.createElement("button");
          btn.className = "cal-event";
          btn.style.background = color + "33";
          btn.style.borderLeft = `3px solid ${color}`;
          btn.innerHTML = `<div class="cal-event-title">${film.title.length > 30 ? film.title.slice(0,28)+"…" : film.title}</div><div class="cal-event-time">${s.time||""}</div>`;
          btn.onclick = () => openModal(film);
          cell.appendChild(btn);
        });
      });
      td.appendChild(cell);
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openModal(film) {
  document.getElementById("modalImg").src = film.img||"";
  document.getElementById("modalImg").style.display = film.img ? "block" : "none";
  document.getElementById("modalType").textContent = film.type||"";
  document.getElementById("modalTitle").textContent = film.title;
  document.getElementById("modalDesc").textContent = film.desc||"No description.";
  document.getElementById("modalLink").href = film.link;

  const screenDiv = document.getElementById("modalScreenings");
  screenDiv.innerHTML = "";
  const screenTitle = document.getElementById("modalScreenTitle");
  if (film.screenings && film.screenings.length) {
    screenTitle.style.display = "";
    film.screenings.forEach(s => {
      const a = document.createElement("a");
      a.className = "modal-screening";
      a.href = s.buy||film.link;
      a.target = "_blank";
      a.style.background = venueColor(s.venue)+"22";
      a.style.borderLeft = `3px solid ${venueColor(s.venue)}`;
      const day = s.date ? new Date(s.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) : "";
      a.innerHTML = `<div class="modal-screening-venue">${s.venue||"VR/Immersive"}</div>
        <div class="modal-screening-when">${day} ${s.time||""}</div>
        ${s.buy && s.buy.includes("goout") ? '<div class="modal-screening-buy">Buy tickets</div>' : ""}`;
      screenDiv.appendChild(a);
    });
  } else { screenTitle.style.display = "none"; }

  document.getElementById("modalBackdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalBackdrop")) return;
  document.getElementById("modalBackdrop").classList.remove("open");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

function openRandom() {
  const filtered = getFiltered();
  if (!filtered.length) return;
  const film = filtered[Math.floor(Math.random() * filtered.length)];
  openModal(film);
}

render();
</script>
</body>
