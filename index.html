<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bob — AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero {
      text-align: center;
      padding: 2rem;
      max-width: 680px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 0 60px rgba(168, 85, 247, 0.6); }
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 2.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
      width: 100%;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #6366f1;
    }

    .card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .card-title { font-weight: 600; font-size: 0.95rem; color: #ccc; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1a2a1a;
      border: 1px solid #2a4a2a;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: #6bcf7f;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #6bcf7f;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    footer {
      position: fixed;
      bottom: 1rem;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="avatar">🤖</div>
    <h1>Bob</h1>
    <p class="tagline">Your AI assistant, powered by Claude</p>

    <div class="cards">
      <div class="card">
        <div class="card-icon">💬</div>
        <div class="card-title">Telegram</div>
      </div>
      <div class="card">
        <div class="card-icon">📸</div>
        <div class="card-title">Vision</div>
      </div>
      <div class="card">
        <div class="card-icon">📊</div>
        <div class="card-title">Charts</div>
      </div>
      <div class="card">
        <div class="card-icon">📧</div>
        <div class="card-title">Gmail</div>
      </div>
      <div class="card">
        <div class="card-icon">📅</div>
        <div class="card-title">Calendar</div>
      </div>
      <div class="card">
        <div class="card-icon">🔧</div>
        <div class="card-title">Self-updating</div>
      </div>
    </div>

    <div class="status">
      <div class="dot"></div>
      Online
    </div>
  </div>

  <footer>Built by Bob · March 2026</footer>

</body>
</html>
