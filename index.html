<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>One World 2026 – Film Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d14;
      --card: #15151f;
      --border: #252535;
      --accent: #e63946;
      --accent2: #457b9d;
      --text: #e0e0e0;
      --muted: #888;
      --tag: #1d2d44;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a0a0a 0%, #0d0d14 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .logo-main { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .logo-sub { font-size: 0.75rem; color: var(--muted); letter-spacing: .05em; }

    .controls {
      display: flex;
      gap: 0.6rem;
      flex: 1;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type=text] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.9rem;
      flex: 1;
      min-width: 160px;
      outline: none;
      transition: border-color .2s;
    }
    input[type=text]:focus { border-color: var(--accent2); }
    input[type=text]::placeholder { color: var(--muted); }

    select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .count {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
      margin-left: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
      padding: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(230,57,70,.15);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #1a1a2e;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1a1a2e 0%, #15151f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .card-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-type {
      font-size: 0.7rem;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .type-badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--tag);
      color: var(--accent2);
      font-weight: 600;
    }

    .visit-link {
      font-size: 0.75rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .visit-link:hover { text-decoration: underline; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-type {
      font-size: 0.75rem;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .modal-desc {
      color: #bbb;
      line-height: 1.7;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--tag); color: var(--text); }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0,0,0,.5);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-wrapper {
      position: relative;
    }

    .filter-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      padding: 0 1.5rem 0.8rem;
    }

    .filter-tag {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--card);
      transition: all .15s;
    }
    .filter-tag:hover, .filter-tag.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-tag.vr { }
    .filter-tag.feature { }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .modal-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-main">🎬 One World 2026</span>
    <span class="logo-sub">International Human Rights Film Festival · 11–19 March · Prague</span>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search films…" oninput="render()">
    <select id="typeFilter" onchange="render()">
      <option value="">All types</option>
      <option value="Full-length documentary">Documentary</option>
      <option value="Feature film">Feature film</option>
      <option value="Short documentary">Short</option>
      <option value="Virtual reality">Virtual Reality</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="filter-tags" id="tagStrip"></div>

<div class="grid" id="grid"></div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-wrapper">
    <div class="modal" id="modal">
      <img class="modal-img" id="modalImg" src="" alt="">
      <div class="modal-body">
        <div class="modal-type" id="modalType"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-actions">
          <a class="btn btn-primary" id="modalLink" href="#" target="_blank">View on One World →</a>
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
</div>

<script>
const FILMS = [{"type": "Full-length documentary", "title": "2000 Meters to Andriivka", "link": "https://www.oneworld.cz/films/57974-2000-meters-to-andriivka", "desc": "The small Ukrainian village of Andriivka, destroyed by Russian aggression, represents a crucial strategic point. A Ukrainian military unit is tasked with a single mission: to reclaim an occupied targe", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20040"}, {"type": "Full-length documentary", "title": "32 Meters", "link": "https://www.oneworld.cz/films/59399-32-meters", "desc": "A humorous look into the heart of a Turkish village, where a group of women decide to challenge traditional social roles in an imaginative way. They do so with due wit and stubbornness.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20041"}, {"type": "Virtual reality", "title": "8 Billion Selves", "link": "https://www.oneworld.cz/films/59680-8-billion-selves", "desc": "Is it possible to attain uniqueness among eight billion others? 8 Billion Selves is a flowing, dreamlike journey through a world where people “are born, work, wage war, love, dance, create art, and di", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20042"}, {"type": "Full-length documentary", "title": "80 Angry Journalists", "link": "https://www.oneworld.cz/films/59666-80-angry-journalists", "desc": "The Hungarian government succeeded in taking control of one of the country’s most prominent independent media outlets, Index.hu. The journalists fight back with every tool at their disposal, but the s", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20195"}, {"type": "Full-length documentary", "title": "9-Month Contract", "link": "https://www.oneworld.cz/films/57975-9-month-contract", "desc": "Surrogacy in Georgia exists in a legal gray zone, yet for young single mother Zhana, it seems like the only way to provide herself and her daughter Elena with a dignified life, education, and a future", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20044"}, {"type": "Full-length documentary", "title": "A Fox Under a Pink Moon", "link": "https://www.oneworld.cz/films/59559-a-fox-under-a-pink-moon", "desc": "Millions of Afghan men and women live in Iran without permanent legal status or protection. Sixteen-year-old Soraya suffers domestic abuse as well as the inability to freely decide her own future.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20078"}, {"type": "Full-length documentary", "title": "A Free Daughter of Free Kyrgyzstan", "link": "https://www.oneworld.cz/films/58528-a-free-daughter-of-free-kyrgyzstan", "desc": "Zere is a rebel, stirring the stagnant waters of Kyrgyz patriarchy. Through her music and public performances, she exposes the alarming state of girls’ and women’s rights in a country where they are e", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20045"}, {"type": "Full-length documentary", "title": "Action Item", "link": "https://www.oneworld.cz/films/58850-action-item", "desc": "Fatigue as the norm, performance as an obligation. Burnout is becoming a hidden yet widespread experience for people living under constant pressure and the expectation of uninterrupted online and prof", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20046"}, {"type": "Short documentary", "title": "Alex – Everyone is Special", "link": "https://www.oneworld.cz/films/59644-alex-everyone-is-special", "desc": "Alex is a happy, twelve-year old boy with autism who loves school and his friends. This year, he has set himself a challenging new goal: to learn how to ride a bike.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20198"}, {"type": "Feature film", "title": "Allah Is Not Obliged", "link": "https://www.oneworld.cz/films/58285-allah-is-not-obliged", "desc": "Birahim is only ten years old, yet he must embark on a journey across West Africa, an area plagued by armed conflict. His search for relatives leads him through bands of child soldiers where compassio", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20048"}, {"type": "Full-length documentary", "title": "AMOOSED: a moose odyssey", "link": "https://www.oneworld.cz/films/59383-amoosed-a-moose-odyssey", "desc": "Moose have played a vital and, to this day, somewhat mysterious role in our world since time immemorial. Their massive figures reflect considerable strength, a calm beauty, and the forgotten bond betw", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20193"}, {"type": "Virtual reality", "title": "Another Place", "link": "https://www.oneworld.cz/films/58640-another-place", "desc": "A young trans woman awaits asylum in France, wandering the city at night in a state of unease. Will she ever return home to her cats?", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20050"}, {"type": "Special", "title": "Awarded Film: International Competition", "link": "https://www.oneworld.cz/films/59681-awarded-film-international-competition", "desc": "", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID="}, {"type": "Full-length documentary", "title": "Better Go Mad in the Wild", "link": "https://www.oneworld.cz/films/58487-better-go-mad-in-the-wild", "desc": "Is it possible to escape the modern world and survive solely in the company of one’s brother, a few pets, and one’s own imagination? An intimate look at the magical coexistence of modern-day hermits i", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20051"}, {"type": "Full-length documentary", "title": "Carmela and the Walkers", "link": "https://www.oneworld.cz/films/58696-carmela-and-the-walkers", "desc": "Carmela helps thousands of Venezuelan refugees, bravely doing so often at great personal cost. This black-and-white documentary shows how exhausting it can be to do good while trying to keep your own ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20052"}, {"type": "Full-length documentary", "title": "Coexistence, My Ass!", "link": "https://www.oneworld.cz/films/57984-coexistence-my-ass", "desc": "Comedienne Noam Shuster-Eliassi takes up the fight against prejudice towards the Palestinian people. Her weapons are a microphone, courage, and humour. But can an Israeli celebrity change her own soci", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20053"}, {"type": "Full-length documentary", "title": "Cuba&Alaska", "link": "https://www.oneworld.cz/films/58526-cuba-alaska", "desc": "Kuba and Alaska enlist as paramedics on the front lines near Kharkiv, Ukraine, where the brutality of war tests them daily. Humor and friendship keep their faith in victory alive amid the chaos.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20056"}, {"type": "Full-length documentary", "title": "Cutting Through Rocks", "link": "https://www.oneworld.cz/films/58068-cutting-through-rocks", "desc": "Sara lives in an Iranian village, where she becomes the first woman elected to the local council. Charismatic and determined, she carves a path through a conservative society on her motorcycle, fighti", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20187"}, {"type": "Full-length documentary", "title": "Dangerous Games: Roblox and the Metaverse Exposed", "link": "https://www.oneworld.cz/films/59677-dangerous-games-roblox-and-the-metaverse-exposed", "desc": "The gaming platform Roblox is a digital world primarily designed for children. But beneath its playful surface lie extremism, racism, and sexual predators. Three teenage girls take it upon themselves ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20058"}, {"type": "Feature film", "title": "Deaf", "link": "https://www.oneworld.cz/films/58228-deaf", "desc": "Ángela is expecting a baby, but her genuine excitement is tinged with worry. How will she navigate motherhood in a world that cannot hear her? This exceptionally sensitive drama explores partnership a", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20190"}, {"type": "Full-length documentary", "title": "Dear Tomorrow", "link": "https://www.oneworld.cz/films/58069-dear-tomorrow", "desc": "Japan has recently become a hot tourist destination—a place everyone wants to be. But behind the neon lights of its big cities lies a major loneliness epidemic.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20189"}, {"type": "Full-length documentary", "title": "Death of Death", "link": "https://www.oneworld.cz/films/59480-death-of-death", "desc": "A futuristic journey in pursuit of immortality that explores the thrilling and unsettling boundaries of human existence.", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20062"}, {"type": "Full-length documentary", "title": "Desert Passages", "link": "https://www.oneworld.cz/films/59603-desert-passages", "desc": "The Colorado River is drying up. Once a lifeline linking the southwestern United States and Mexico, it is now a witness to shifting ecosystems, changing ways of life, and the widening inequalities of ", "img": "https://muj.jedensvet.cz/filmimages/image.ashx?I=2&W=640&H=356&ID=0&IMGID=20063"}, {"type": "Full-length documentary", "title": "Devi", "link": "https://www.oneworld.cz/films/59343-devi", "desc": "Once at the forefront of the fight for equality and justice, her voice has now become inconvenient for the regime. Nepali politician Devi Khadku is one of thousands of women who were subjected to viol", "img": "https://muj.jedensvet.cz/filmimages/ima const typeEmoji = {
  'Full-length documentary': '🎥',
  'Feature film': '🎞️',
  'Short documentary': '📽️',
  'Virtual reality': '🥽',
  'Special': '⭐',
};

let activeTag = '';

// Build tag strip from types
const tagStrip = document.getElementById('tagStrip');
const allTypes = [...new Set(FILMS.map(f => f.type))].filter(Boolean).sort();
allTypes.forEach(type => {
  const btn = document.createElement('button');
  btn.className = 'filter-tag';
  btn.textContent = (typeEmoji[type] || '🎬') + ' ' + type;
  btn.dataset.type = type;
  btn.onclick = () => {
    activeTag = activeTag === type ? '' : type;
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.toggle('active', b.dataset.type === activeTag));
    document.getElementById('typeFilter').value = activeTag;
    render();
  };
  tagStrip.appendChild(btn);
});

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('typeFilter').value || activeTag;
  
  const filtered = FILMS.filter(f => {
    const matchQ = !q || f.title.toLowerCase().includes(q) || (f.desc||'').toLowerCase().includes(q);
    const matchType = !type || f.type === type;
    return matchQ && matchType;
  });

  document.getElementById('count').textContent = filtered.length + ' of ' + FILMS.length + ' films';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No films match your search 🎬</div>';
    return;
  }

  filtered.forEach((film, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(film);

    const imgHtml = film.img
      ? `<img class="card-img" src="${film.img}" alt="${film.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholderHtml = `<div class="card-img-placeholder" style="${film.img ? 'display:none' : ''}">${typeEmoji[film.type] || '🎬'}</div>`;

    card.innerHTML = `
      ${imgHtml}
      ${placeholderHtml}
      <div class="card-body">
        <div class="card-type">${film.type || ''}</div>
        <div class="card-title">${film.title}</div>
        <div class="card-desc">${film.desc || 'No description available.'}</div>
        <div class="card-footer">
          <span class="type-badge">${typeEmoji[film.type] || '🎬'}</span>
          <a class="visit-link" href="${film.link}" target="_blank" onclick="event.stopPropagation()">oneworld.cz →</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openModal(film) {
  document.getElementById('modalImg').src = film.img || '';
  document.getElementById('modalImg').style.display = film.img ? 'block' : 'none';
  document.getElementById('modalType').textContent = film.type || '';
  document.getElementById('modalTitle').textContent = film.title;
  document.getElementById('modalDesc').textContent = film.desc || 'No description available.';
  document.getElementById('modalLink').href = film.link;
  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modalBackdrop')) return;
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
